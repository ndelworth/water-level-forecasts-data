name: get-chs-data

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: get-chs-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      - name: Poll wlf snapshot
        run: uv run python poll_wlf_snapshot.py
      - name: Poll wlo actuals
        run: uv run python poll_wlo_actuals.py
      - name: Poll wlp snapshot
        run: uv run python poll_wlp_snapshot.py

      - name: Check out the surge model
        uses: actions/checkout@v4
        with:
          repository: ndelworth/tide_predictions
          path: model
      - name: Run the surge model
        id: model
        continue-on-error: true
        working-directory: model
        run: |
          uv venv --python 3.12 .venv-predict
          uv pip install --python .venv-predict --index-url https://download.pytorch.org/whl/cpu torch
          uv pip install --python .venv-predict "numpy>=2" "pandas>=3" requests
          .venv-predict/bin/python predict.py --out "$GITHUB_WORKSPACE/forecast.json"
      - name: Store model forecast
        if: steps.model.outcome == 'success'
        run: uv run python poll_own_forecast.py forecast.json

      - name: Publish chunked db for GitHub Pages
        run: uv run python publish_chunks.py
      - name: Build docs/live.json for the blog chart
        run: uv run python build_site_json.py
      - name: Commit snapshot data
        run: |
          git config user.name "wlf-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/tides.db docs/tides_chunks docs/live.json
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "data: hourly update $(date -u +%FT%H:%MZ)"
          git pull --rebase origin main
          git push
